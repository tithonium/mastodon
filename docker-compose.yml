# This file is designed for production server deployment, not local development work
# For a containerized local dev environment, see: https://github.com/mastodon/mastodon/blob/main/docs/DEVELOPMENT.md#docker

services:
  db:
    image: postgres:14-alpine
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - /mnt/cluster/mastodon/clacks/postgres14:/var/lib/postgresql/data
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    deploy:
      placement:
        constraints:
          - node.labels.cpu == high
          - node.labels.mem == high

  redis:
    image: redis:7-alpine
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - /mnt/cluster/mastodon/clacks/redis:/data
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.labels.mem == high

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    environment:
      - "ELASTIC_PASSWORD=password" # Username is elastic. Do not change the username.
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g -Des.enforce.bootstrap.checks=true" # Please update the memory to suit your environment or you will have wasted memory. both -Xms & -Xmx must be the same size. 1g for GB.
      - "xpack.license.self_generated.type=basic"
      - "xpack.security.enabled=false"
      - "xpack.watcher.enabled=false"
      - "xpack.graph.enabled=false"
      - "xpack.ml.enabled=false"
      - "bootstrap.memory_lock=true"
      - "cluster.name=es-mastodon"
      - "discovery.type=single-node"
    networks:
       - external_network
       - internal_network
    healthcheck:
       test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
    volumes:
      - /mnt/cluster/mastodon/clacks/elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '127.0.0.1:9200:9200'
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.labels.cpu == high
          - node.labels.mem == high

  web:
    # You can uncomment the following line if you want to not use the prebuilt image, for example if you have local code changes
    # build: .
    image: ghcr.io/tithonium/mastodon:clacks
    env_file: /mnt/cluster/mastodon/clacks/.env.production
    command: bundle exec puma -C config/puma.rb
    networks:
      - external_network
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    ports:
      - '8086:3000'
    depends_on:
      - db
      - redis
      - es
    volumes:
      - /mnt/cluster/mastodon/clacks/public/system:/mastodon/public/system
      - /mnt/cluster/mastodon/clacks/public/docs:/mastodon/public/docs
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 2
        constraints:
          - node.platform.arch == x86_64
          - node.labels.cpu == high
          - node.labels.mem == high

  streaming:
    # You can uncomment the following lines if you want to not use the prebuilt image, for example if you have local code changes
    # build:
    #   dockerfile: ./streaming/Dockerfile
    #   context: .
    image: ghcr.io/tithonium/mastodon-streaming:clacks
    env_file: /mnt/cluster/mastodon/clacks/.env.production
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:3000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    ports:
      - '8087:3000'
    depends_on:
      - db
      - redis
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 2
        constraints:
          - node.platform.arch == x86_64
          - node.labels.cpu == high
          - node.labels.mem == high

  sidekiq:
    # You can uncomment the following line if you want to not use the prebuilt image, for example if you have local code changes
    # build: .
    image: ghcr.io/tithonium/mastodon:clacks
    env_file: /mnt/cluster/mastodon/clacks/.env.production
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
    volumes:
      - /mnt/cluster/mastodon/clacks/public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]
    deploy:
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.platform.arch == x86_64
          - node.labels.cpu == high
          - node.labels.mem == high

  ## Uncomment to enable federation with tor instances along with adding the following ENV variables
  ## http_hidden_proxy=http://privoxy:8118
  ## ALLOW_ACCESS_TO_HIDDEN_SERVICE=true
  # tor:
  #   image: sirboops/tor
  #   networks:
  #      - external_network
  #      - internal_network
  #
  # privoxy:
  #   image: sirboops/privoxy
  #   volumes:
  #     - /mnt/cluster/mastodon/clacks/priv-config:/opt/config
  #   networks:
  #     - external_network
  #     - internal_network

networks:
  external_network:
  internal_network:
    internal: true
